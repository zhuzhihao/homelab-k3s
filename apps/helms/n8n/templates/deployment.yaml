apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "n8n.fullname" . }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
    {{- if .Values.main.deploymentLabels }}
    {{- toYaml .Values.main.deploymentLabels | nindent 4 }}
    {{- end }}
  {{- if .Values.main.deploymentAnnotations }}
  annotations:
    {{- toYaml .Values.main.deploymentAnnotations | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.main.autoscaling.enabled }}
  replicas: {{ .Values.main.replicaCount }}
  {{- end }}
  strategy:
    type: {{ .Values.main.deploymentStrategy.type }}
    {{- if eq .Values.main.deploymentStrategy.type "RollingUpdate" }}
    rollingUpdate:
      maxSurge: {{ default "25%" .Values.main.deploymentStrategy.maxSurge  }}
      maxUnavailable: {{ default "25%" .Values.main.deploymentStrategy.maxUnavailable }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "n8n.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/type: master
  template:
    metadata:
      annotations:
        checksum/config: {{ print .Values.main | sha256sum }}
        {{- if and .Values.runner.enabled (not .Values.runner.existingSecret) }}
        checksum/runner-auth: {{ include "n8n.runnerAuthToken" . | sha256sum }}
        {{- end }}
        {{- with .Values.main.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "n8n.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/type: master
        {{- if .Values.main.podLabels }}
          {{ toYaml .Values.main.podLabels | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "n8n.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.main.podSecurityContext | nindent 8 }}
      {{- if or .Values.main.initContainers }}
      initContainers:
      {{- if .Values.main.initContainers }}
        {{ tpl (toYaml .Values.main.initContainers) . | nindent 10 }}
      {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.main.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.main.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            {{- if .Values.main.config }}
            - configMapRef:
                name: {{ include "n8n.fullname" . }}-app-config
            {{- end }}
           {{- if .Values.main.secret }}
            - secretRef:
                name: {{ include "n8n.fullname" . }}-app-secret
            {{- end }}
          {{- if or .Values.runner.enabled .Values.main.extraEnv }}
          env:
            {{- if .Values.runner.enabled }}
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: N8N_RUNNERS_MODE
              value: "external"
            - name: N8N_RUNNERS_BROKER_LISTEN_ADDRESS
              value: "0.0.0.0"
            {{- if ne (int .Values.runner.brokerPort) 5679 }}
            - name: N8N_RUNNERS_BROKER_PORT
              value: {{ .Values.runner.brokerPort | quote }}
            {{- end }}
            {{- if .Values.runner.nativePythonRunner }}
            - name: N8N_NATIVE_PYTHON_RUNNER
              value: "true"
            {{- end }}
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "n8n.runnerAuthSecretName" . }}
                  key: {{ include "n8n.runnerAuthSecretKey" . }}
            {{- end }}
            {{- range $key, $value := .Values.main.extraEnv }}
            - name: {{ $key }}
              {{- toYaml $value | nindent 14 }}
            {{- end }}
          {{- end }}
          lifecycle:
            {{- toYaml .Values.main.lifecycle | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ get (default (dict) .Values.main.config) "port" | default 5678 }}
              protocol: TCP
          {{- with .Values.main.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.main.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.main.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
          {{- if .Values.main.extraVolumeMounts }}
            {{- toYaml .Values.main.extraVolumeMounts | nindent 12 }}
          {{- end }}
        {{- if .Values.runner.enabled }}
        - name: task-runners
          securityContext:
            {{- toYaml .Values.runner.securityContext | nindent 12 }}
          image: "{{ .Values.runner.image.repository }}:{{ .Values.runner.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.runner.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: N8N_RUNNERS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "n8n.runnerAuthSecretName" . }}
                  key: {{ include "n8n.runnerAuthSecretKey" . }}
            - name: N8N_RUNNERS_TASK_BROKER_URI
              value: {{ printf "http://127.0.0.1:%v" .Values.runner.brokerPort | quote }}
            - name: N8N_RUNNERS_MAX_CONCURRENCY
              value: {{ .Values.runner.maxConcurrency | quote }}
            {{- range $key, $value := .Values.runner.extraEnv }}
            - name: {{ $key }}
              {{- toYaml $value | nindent 14 }}
            {{- end }}
          ports:
            - name: health
              containerPort: {{ .Values.runner.launcherHealthCheckPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
        {{- end }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.main.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.main.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.main.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: "data"
          {{ include "n8n.pvc" . }}
        {{- if .Values.main.extraVolumes }}
          {{- toYaml .Values.main.extraVolumes | nindent 8 }}
        {{- end }}
