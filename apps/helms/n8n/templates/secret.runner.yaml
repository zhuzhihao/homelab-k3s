{{- if and .Values.runner.enabled (not .Values.runner.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-runner-auth" (include "n8n.fullname" .) }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
type: Opaque
data:
  authToken: {{ include "n8n.runnerAuthToken" . | b64enc }}
{{- end }}